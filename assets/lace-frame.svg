  </defs>
  <!-- Outer scalloped edge -->
  <rect x="8" y="8" width="404" height="404" rx="4"
        fill="none" stroke="white" stroke-width="2" opacity="0.95"/>
  <rect x="18" y="18" width="384" height="384"
        fill="none" stroke="white" stroke-width="1" stroke-dasharray="4 6" opacity="0.7"/>
