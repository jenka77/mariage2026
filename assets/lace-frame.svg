  <path d="M8,8 Q40,8 40,40" stroke="white" stroke-width="1.5" fill="none" opacity="0.8"/>
  <path d="M412,8 Q380,8 380,40" stroke="white" stroke-width="1.5" fill="none" opacity="0.8"/>
