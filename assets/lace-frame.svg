  <path d="M30,30 C30,22 38,18 42,24 C46,18 54,22 54,30 C54,40 42,50 42,50 C42,50 30,40 30,30Z" fill="white" opacity="0.85" transform="scale(0.7) translate(10,10)"/>
  <path d="M30,30 C30,22 38,18 42,24 C46,18 54,22 54,30 C54,40 42,50 42,50 C42,50 30,40 30,30Z" fill="white" opacity="0.85" transform="scale(0.7) translate(510,10)"/>
  <path d="M30,30 C30,22 38,18 42,24 C46,18 54,22 54,30 C54,40 42,50 42,50 C42,50 30,40 30,30Z" fill="white" opacity="0.85" transform="scale(0.7) translate(10,510)"/>
  <path d="M30,30 C30,22 38,18 42,24 C46,18 54,22 54,30 C54,40 42,50 42,50 C42,50 30,40 30,30Z" fill="white" opacity="0.85" transform="scale(0.7) translate(510,510)"/>
  <!-- Dove silhouettes (simplified) -->
  <path d="M200,22 C205,18 215,18 210,24 C218,22 222,28 215,28 C220,32 210,34 205,30 C200,34 190,32 195,28 C188,28 192,22 200,24Z" fill="white" opacity="0.75"/>
  <path d="M200,398 C205,394 215,394 210,400 C218,398 222,404 215,404 C220,408 210,410 205,406 C200,410 190,408 195,404 C188,404 192,398 200,400Z" fill="white" opacity="0.75"/>
