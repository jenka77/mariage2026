  <circle cx="210" cy="32" r="6" fill="none" stroke="white" stroke-width="1" opacity="0.6"/>
  <circle cx="210" cy="388" r="6" fill="none" stroke="white" stroke-width="1" opacity="0.6"/>
  <circle cx="32" cy="210" r="6" fill="none" stroke="white" stroke-width="1" opacity="0.6"/>
  <circle cx="388" cy="210" r="6" fill="none" stroke="white" stroke-width="1" opacity="0.6"/>
